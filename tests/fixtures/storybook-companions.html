<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest companion visual check</title>

<body><main id="root"></main><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {CompanionPortrait} from '/src/components/CompanionPortrait.tsx';
import {PET_IDS} from '/src/progress/progress.ts';
createRoot(document.getElementById('root')).render([null,...PET_IDS].map(pet=>React.createElement('article',{key:pet??'original'},React.createElement(CompanionPortrait,{pet,design:'storybook'}),React.createElement('h2',{},pet??'original'))));
