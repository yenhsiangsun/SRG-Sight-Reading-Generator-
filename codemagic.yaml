workflows:
  iphone-ipad-review-screenshots:
    name: TONECRAFT 1.0 (14) - iPhone 6.3 and iPad 13 review screenshots
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: 26.4
      node: 24
      vars:
        CAPTURE_DEVICES: review
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: codex/tonecraft-review-capture
          include: true
          source: true
    scripts: &capture_steps
      - name: Prepare the review source for an unsigned Simulator build
        script: |
          set -euo pipefail
          git diff --exit-code 443dfad016685cf71f0ba08c30c2594bc86dd474 HEAD -- src public ios package.json package-lock.json capacitor.config.ts
          npm ci
          npm run build
          npx cap sync ios
          sips --resampleHeightWidth 1024 1024 ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Capture actual Traditional Chinese product screens
        script: bash duo-capture/capture.sh "$CAPTURE_DEVICES"
    artifacts: &capture_artifacts
      - build/capture/*/*.txt
      - build/capture/*/*.log
      - build/capture/*/*.json
      - build/capture/*/attachments/*
  iphone-duo-screenshots:
    name: TONECRAFT 1.0 (14) - iPhone Duo screenshots only
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: 27.1
      node: 24
      vars:
        CAPTURE_DEVICES: duo
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: codex/tonecraft-duo-capture
          include: true
          source: true
    scripts: *capture_steps
    artifacts: *capture_artifacts
