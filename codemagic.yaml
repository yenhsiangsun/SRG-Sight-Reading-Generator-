workflows:
  iphone-duo-screenshots:
    name: TONECRAFT 1.0 (14) - iPhone Duo screenshots only
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: 27.1
      node: 24
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: codex/tonecraft-duo-capture
          include: true
          source: true
    scripts:
      - name: Prepare the review source for an unsigned Simulator build
        script: |
          set -euo pipefail
          git diff --exit-code 443dfad016685cf71f0ba08c30c2594bc86dd474 HEAD -- src public ios package.json package-lock.json capacitor.config.ts
          npm ci
          npm run build
          npx cap sync ios
          sips --resampleHeightWidth 1024 1024 ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Capture actual Traditional Chinese product screens on iPhone Duo
        script: bash duo-capture/capture.sh
    artifacts:
      - build/duo/*.png
      - build/duo/*.txt
      - build/duo/*.log
      - build/duo/*.json
      - build/duo/attachments/*
