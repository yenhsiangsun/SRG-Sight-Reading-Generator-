workflows:
  plus-review-evidence:
    name: Tonecraft Plus native review evidence
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: sight-reading-generator
    environment:
      xcode: 26.4
      node: 24
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: codex/tonecraft-plus-review-evidence
          include: true
          source: true
    scripts:
      - name: Build the same iOS practice interface
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Capture and exercise StoreKit plans on the native iPhone Simulator
        script: bash scripts/test-ios-plus.sh
      - name: Upload verified native review screenshot to both Tonecraft subscriptions
        script: node scripts/upload-ios-plus-review.mjs build/ios/plus-review/attachments
    artifacts:
      - build/ios/plus-review/attachments/*
      - build/ios/plus-review/*.log
