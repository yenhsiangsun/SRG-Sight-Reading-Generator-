<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>二胡練習 · 替代音色試聽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:#253b34;font:16px/1.65 system-ui,sans-serif}main{max-width:800px;padding:48px 24px;margin:auto}a{color:#315b4e}h1{font-size:34px;margin:22px 0 8px}p{color:#59685e}section{background:white;border:1px solid #d9dfd5;padding:24px;border-radius:16px;margin:20px 0}label{display:block;margin-bottom:12px}select,button{font:inherit;padding:12px 16px;border:1px solid #bac8bc;border-radius:9px;background:white;color:inherit}select{width:100%}button{cursor:pointer;margin:5px 6px 5px 0}button.primary{background:#2e584b;color:white}button:disabled{opacity:.5;cursor:wait}#status{min-height:52px;padding:14px;background:#e8eee6;border-radius:10px}small{color:#637067}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
</style>
<main><a href="/">← 回到練習室</a><h1>二胡音源仍待補齊。</h1>
<p>已停用 AliExpress、BISA 和最新被你否定的錄音。現在暫借小提琴實錄，並非真正二胡音色。</p>
<section><h2>目前：小提琴實錄替代</h2><p>樂譜仍按二胡的 D4–D6 音域生成。替代音色只供練習；合格的二胡錄音與 App 散布授權仍待補齊。</p><a href="/samples/CREDITS.txt">查看音源出處</a></section><section><label for="phrase">試聽內容</label><select id="phrase">
<option value="melody">旋律短句</option><option value="low">低音 D4 → A4</option><option value="high">高音 A5 → D6</option><option value="sustain">A4 長音 · 8 秒</option><option value="top">D6 長音 · 8 秒</option><option value="fast">快速連奏</option></select>
<button id="after" class="primary">▶ 播放替代音色</button><button id="stop">■ 停止</button><p id="status" role="status">選擇一段，開始試聽。</p><small>本機已使用替代音色。依你的要求，這次沒有更新 TestFlight。</small></section>
<details><summary>檢查音訊</summary><button id="verify">檢查音域、長音與快速連奏</button><pre id="results"></pre><a id="download" hidden download="erhu-violin-substitute-demo.wav">下載替代音色短句</a></details></main>
<script type="module">
import * as Tone from 'tone';
import {createPlaybackInstrument} from './src/audio/createPlaybackInstrument.ts';
const status=document.querySelector('#status'),results=document.querySelector('#results');
const sequences={
melody:[['D4',.45],['F4',.3],['A4',.45],['B4',.3],['A4',.3],['G4',.45],['E4',.3],['D4',1.1],['A4',.3],['C5',.3],['D5',.65],['C5',.3],['A4',.45],['G4',.3],['F4',.3],['E4',.3],['D4',1.1]],
low:['D4','E4','F#4','G4','A4'].map(n=>[n,.75]),high:['A5','A#5','B5','C6','C#6','D6'].map(n=>[n,.75]),
sustain:[['A4',8]],top:[['D6',8]],fast:Array.from({length:4},()=>['D4','A4','G4','F4','A4','C5','D5','A4']).flat().map(n=>[n,.09])};
let voice,timer,controller,request=0,busy=false,demoUrl;
function stop(){request++;clearTimeout(timer);controller?.abort();controller=null;voice?.dispose();voice=null;document.querySelectorAll('audio').forEach(audio=>audio.pause());}
function schedule(synth,sequence,start){let t=start;for(const [n,d] of sequence){synth.triggerAttackRelease(n,d,t,.7);t+=d+.045;}return t;}
async function play(){if(busy)return;stop();const ticket=request;controller=new AbortController();status.textContent='載入音源中…';try{await Tone.start();const sequence=sequences[document.querySelector('#phrase').value],notes=sequence.map(([n])=>n);const loaded=await createPlaybackInstrument('Erhu',notes,controller.signal);if(ticket!==request){loaded.dispose();return;}voice=loaded;const start=Tone.now()+.08,end=schedule(voice,sequence,start);status.textContent='正在播放：小提琴實錄（暫代二胡）';timer=setTimeout(()=>{if(ticket===request){stop();status.textContent='播放完成。';}},(end-start+.3)*1000);}catch(e){if(ticket===request){stop();status.textContent=e.message;}}}
document.querySelector('#after').onclick=()=>play();document.querySelector('#stop').onclick=()=>{stop();status.textContent='已停止';};document.querySelector('#phrase').onchange=()=>{stop();status.textContent='選擇一段，開始試聽。';};
function wav(buffer){const samples=buffer.getChannelData(0),bytes=new ArrayBuffer(44+samples.length*2),view=new DataView(bytes),text=(p,s)=>[...s].forEach((c,i)=>view.setUint8(p+i,c.charCodeAt(0)));text(0,'RIFF');view.setUint32(4,36+samples.length*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,buffer.sampleRate,true);view.setUint32(28,buffer.sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,samples.length*2,true);samples.forEach((v,i)=>view.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,v))*32767),true));return new Blob([bytes],{type:'audio/wav'});}
document.querySelector('#verify').onclick=async()=>{if(busy)return;stop();const ticket=request;busy=true;results.textContent='';const button=document.querySelector('#verify');button.disabled=true;try{await Tone.start();for(const [label,sequence] of Object.entries(sequences)){if(ticket!==request)break;status.textContent=`檢查 ${label}…`;let synth,buffer;try{const length=sequence.reduce((sum,[,d])=>sum+d+.045,0)+.4;buffer=await Tone.Offline(async()=>{synth=await createPlaybackInstrument('Erhu',sequence.map(([n])=>n));schedule(synth,sequence,.08);},length,1,44100);const data=buffer.getChannelData(0),rate=buffer.sampleRate;let peak=0;for(const v of data){if(!Number.isFinite(v))throw Error('非有限音訊');peak=Math.max(peak,Math.abs(v));}if(peak>=.95||peak<.005)throw Error(`不合理峰值 ${peak}`);let t=.08;for(const [,d] of sequence){const from=Math.floor((t+Math.min(.04,d/3))*rate),to=Math.floor((t+d)*rate);let sum=0;for(let i=from;i<to;i++)sum+=data[i]**2;if(Math.sqrt(sum/(to-from))<.0001)throw Error(`音符未發聲 ${t}`);t+=d+.045;}if(label==='sustain'||label==='top'){const tail=data.subarray(Math.floor(7*rate),Math.floor(7.8*rate));let sum=0;for(const v of tail)sum+=v*v;if(Math.sqrt(sum/tail.length)<.002)throw Error('長音提早結束');}results.textContent+=`✓ ${label}: peak ${peak.toFixed(3)}, ${sequence.length} notes\n`;if(label==='melody'){if(demoUrl)URL.revokeObjectURL(demoUrl);demoUrl=URL.createObjectURL(wav(buffer));const link=document.querySelector('#download');link.href=demoUrl;link.hidden=false;}}finally{synth?.dispose();buffer?.dispose();}}status.textContent=ticket===request?'音訊檢查完成':'已停止';}catch(e){status.textContent=`檢查未通過：${e.message}`;results.textContent+=`✗ ${e.message}\n`;}finally{busy=false;button.disabled=false;}};
document.querySelectorAll('audio').forEach(audio=>audio.addEventListener('play',()=>{request++;clearTimeout(timer);controller?.abort();voice?.dispose();voice=null;document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause();});}));
window.addEventListener('pagehide',()=>{stop();if(demoUrl)URL.revokeObjectURL(demoUrl);});
</script></html>
